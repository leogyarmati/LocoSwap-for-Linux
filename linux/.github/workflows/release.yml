name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: >
          dotnet publish linux/LocoSwap -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Package
        run: tar -czf LocoSwap-${{ matrix.rid }}.tar.gz -C out .
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --prerelease --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" LocoSwap-${{ matrix.rid }}.tar.gz --clobber
